    name: Information Flow
    description: |
        In these serries of challenges we are going to control the traffic that your computer makes. 
        > Credit: firewal callenges are imported from [intro-to-cybersecurity-dojo/intercepting-communication](https://pwn.college/intro-to-cybersecurity/intercepting-communication)

    challenges:
        - import:
            dojo: intro-to-cybersecurity
            module: intercepting-communication
            challenge: firewall-1
        - import:
            dojo: intro-to-cybersecurity
            module: intercepting-communication
            challenge: firewall-2
        - import:
            dojo: intro-to-cybersecurity
            module: intercepting-communication
            challenge: firewall-3
resources:
    - name: "Getting Started Notes"
      type: markdown
      content: |
        To get started with this module, run the challenge located in `/challenge` from within a terminal session.  This will create the network environment for you to work with.  This will also change your terminal prompt to indicate the host machine you are working on.  You can run the command `exit` to return to your original terminal prompt outside of the challenge network.  Trying to connect to the network hosts outside of the challenge environment will not work.

